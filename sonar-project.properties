# SonarCloud configuration for imboy-admin-frontend (React/TS admin)
#
# 关联：.claude/plans/quality-loop.md v1.3 T4.3（v1.1 §332: 三独立 SonarCloud 项目）
# 创建：2026-05-09 / iteration 78 / T4.3
# 用户配置：在 SonarCloud 创建 imboy-admin-frontend 项目 + GitHub Secret SONAR_TOKEN

sonar.projectKey=imboy-admin-frontend
sonar.organization=imboy-pub
sonar.projectName=imboy-admin-frontend (React Admin)
sonar.projectVersion=1.0.0-rc.1

# Source layout
sonar.sources=src
sonar.tests=src/test,e2e
sonar.sourceEncoding=UTF-8

# Exclusions（与 eslint.config.js globalIgnores 对齐）
sonar.exclusions=\
  dist/**,\
  build/**,\
  out/**,\
  node_modules/**,\
  coverage/**,\
  playwright-report/**,\
  test-results/**,\
  .turbo/**,\
  .vite/**,\
  storybook-static/**,\
  src/api/_gen/**,\
  src/services/api/_gen/**,\
  **/*.gen.ts

sonar.test.exclusions=\
  src/test/fixtures/**,\
  __fixtures__/**,\
  e2e/fixtures/**,\
  __snapshots__/**

# Coverage（bun test --coverage 输出 lcov）
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.app.json
