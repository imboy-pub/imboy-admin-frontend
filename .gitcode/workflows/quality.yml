# GitCode 流水线兜底 — imboyadmin 质量门（与本地 pre-push 同口径：eslint + bun test）
#
# 背景：本仓远端主推 gitcode，.github/workflows/（GitHub Actions）在 gitcode 上
# 不会触发，本文件是 gitcode 侧唯一的远端质量门。本地 lefthook pre-push 为第一道
# （见 lefthook.yml），此处为推送后的远端兜底。
#
# 语法依据（2026-09-29 docs.gitcode.com 流水线章节）：
#   - 文件位置 .gitcode/workflows/*.yml（仅识别 .yml/.yaml）
#   - checkout 非自动，须显式 uses: checkout（内置 action）
#   - runs-on 为标签数组 [os, arch, 规格]；small=2C/8G
#   - 第三方 action（oven-sh/setup-bun 等）在 gitcode 的兼容性未验证，一律手动安装
name: quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: eslint + bun test
    runs-on: [ubuntu-latest, x64, small]
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: checkout

      # 固定现有版本；升级时同步更新发布资产的 SHA256。
      # Keep the current version; update the release digest when upgrading.
      - name: 安装 bun 1.3.6
        run: |
          set -euo pipefail
          BUN_VERSION=1.3.6
          BUN_SHA256=1954abee08900de610a8b4692f5fffa6c6b15d8afde7d1de4d3f88cfc60e7d5f
          bun_install_tmp=$(mktemp -d)
          trap 'rm -rf "$bun_install_tmp"' EXIT
          # baseline 兼容未保证 AVX2 的 x64 runner。
          # The baseline build supports x64 runners without guaranteed AVX2.
          curl --fail --silent --show-error --location --retry 3 \
            --output "$bun_install_tmp/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64-baseline.zip"
          printf '%s  %s\n' "$BUN_SHA256" "$bun_install_tmp/bun.zip" | sha256sum --check --status
          unzip -q "$bun_install_tmp/bun.zip" -d "$bun_install_tmp"
          mkdir -p "$HOME/.bun/bin"
          install -m 0755 "$bun_install_tmp/bun-linux-x64-baseline/bun" "$HOME/.bun/bin/bun"
          ln -sfn bun "$HOME/.bun/bin/bunx"
          bun_installed_version=$("$HOME/.bun/bin/bun" --version)
          test "$bun_installed_version" = "$BUN_VERSION"
          printf 'Bun %s\n' "$bun_installed_version"

      - name: 安装依赖
        run: |
          "$HOME/.bun/bin/bun" install --frozen-lockfile

      - name: Lint
        run: |
          "$HOME/.bun/bin/bun" run lint

      # 口径与本地 pre-push（bun run test = bun test --isolate）完全一致；
      # 勿改裸 bun test——与 package.json script 漂移后排查成本高。
      - name: Unit test
        run: |
          "$HOME/.bun/bin/bun" run test
