# imboy-admin-frontend 质量门 — ESLint + Typecheck + knip + Secrets
#
# 关联：.claude/plans/quality-loop.md v1.3 T4.1（v1.1 §301: 三仓各一份）
# 与 ci.yml 互补：本 workflow 仅跑质量门（lint/typecheck/deadcode/secrets）
# Ratchet 上限：lint 37 / typecheck 31 / knip 35 / gitleaks 40
# 注：lint 阈值 2026-05-10 从 10 修正为 37（baseline 时 quick stat 不全；实跑含 react-hooks/exhaustive-deps 等）
# 创建：2026-05-09 / iteration 74 / T4.1

name: admin Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  # 1) React lint + typecheck + knip (T2.6 落地的 pnpm run check 拆开)
  # ----------------------------------------------------------------
  react-lint:
    name: ESLint + Typecheck + Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same strict commands as ci.yml: process failures must reach the job.
      - name: ESLint
        run: bun run lint

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Knip dead-code
        run: bun run deadcode

  # ----------------------------------------------------------------
  # 2) Secrets — gitleaks (含自定义 admin-tsid-numeric-misuse 规则)
  # ----------------------------------------------------------------
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify no new leaks (ratchet — baseline 40)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          rm -f /tmp/leaks.json
          rc=0
          /tmp/gitleaks detect --no-git --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path /tmp/leaks.json --exit-code 10 || rc=$?
          python3 scripts/check_gitleaks_result.py /tmp/leaks.json "$rc"
