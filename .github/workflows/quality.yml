# imboy-admin-frontend 质量门 — ESLint + Typecheck + knip + Secrets
#
# 关联：.claude/plans/quality-loop.md v1.3 T4.1（v1.1 §301: 三仓各一份）
# 与 ci.yml 互补：本 workflow 仅跑质量门（lint/typecheck/deadcode/secrets）
# lint / typecheck / knip 为零容忍直跑门（无阈值逻辑；2026-11-28 实测三项目全 0：
# lint exit 0 / tsc exit 0 / knip exit 0）。旧「ratchet 上限 lint 37 / typecheck 31 /
# knip 35」注释描述的是早已不存在的阈值机制，2026-11-28 纠正。
# gitleaks 保留递减基线 40（见下方 Verify no new leaks 步）。
# 创建：2026-05-09 / iteration 74 / T4.1

name: admin Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  # 1) React lint + typecheck + knip (T2.6 落地的 pnpm run check 拆开)
  # ----------------------------------------------------------------
  react-lint:
    name: ESLint + Typecheck + Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same strict commands as ci.yml: process failures must reach the job.
      - name: ESLint
        run: bun run lint

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Knip dead-code
        run: bun run deadcode

  # ----------------------------------------------------------------
  # 2) Secrets — gitleaks (含自定义 admin-tsid-numeric-misuse 规则)
  # ----------------------------------------------------------------
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test scanner installation and result handling
        run: python3 -B -m unittest discover -s scripts -p 'test_*gitleaks*.py' -v

      - name: Install verified gitleaks CLI
        timeout-minutes: 5
        run: bash scripts/install_gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Verify no new leaks (ratchet — baseline 40)
        run: |
          set -euo pipefail
          rm -f /tmp/leaks.json
          rc=0
          "$RUNNER_TEMP/gitleaks" detect --no-git --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path /tmp/leaks.json --exit-code 10 || rc=$?
          python3 scripts/check_gitleaks_result.py /tmp/leaks.json "$rc"
