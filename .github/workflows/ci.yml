name: Admin Frontend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      backend_sha:
        description: 'Optional full backend commit SHA for paired validation; empty = main'
        required: false
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

jobs:
  lint-and-build:
    name: ${{ inputs.backend_sha && 'lint-and-build (paired backend SHA)' || 'lint-and-build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      admin_sha: ${{ steps.contract-source.outputs.admin_sha }}
      backend_sha: ${{ steps.contract-source.outputs.backend_sha }}
    env:
      IMBOY_REPO_DIR: ${{ github.workspace }}/.cross-repo/imboy
      IMBOY_CROSS_REPO_REQUIRED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 普通 PR/push 始终对 main；配套验证只接受不可变 SHA。
      # Regular PR/push checks use main; paired runs accept only an immutable SHA.
      - name: Select backend revision
        id: backend-ref
        env:
          BACKEND_SHA: ${{ inputs.backend_sha }}
        run: |
          if [[ -n "$BACKEND_SHA" && ! "$BACKEND_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::backend_sha must be empty (main) or a full 40-character commit SHA"
            exit 1
          fi
          backend_ref="${BACKEND_SHA,,}"
          printf 'ref=%s\n' "${backend_ref:-main}" >> "$GITHUB_OUTPUT"

      - name: Checkout backend SQL source
        uses: actions/checkout@v7
        with:
          repository: imboy-pub/imboy
          ref: ${{ steps.backend-ref.outputs.ref }}
          path: .cross-repo/imboy
          persist-credentials: false
          sparse-checkout: src/features/enterprise_business/infrastructure/eb_pg_store_sql.erl
          sparse-checkout-cone-mode: false

      - name: Record tested revisions
        id: contract-source
        env:
          BACKEND_REF: ${{ steps.backend-ref.outputs.ref }}
        run: |
          admin_sha="$(git rev-parse HEAD)"
          backend_sha="$(git -C "$IMBOY_REPO_DIR" rev-parse HEAD)"
          if [[ "$BACKEND_REF" != main && "$backend_sha" != "$BACKEND_REF" ]]; then
            echo "::error::Backend checkout does not match the requested SHA"
            exit 1
          fi
          printf 'admin_sha=%s\n' "$admin_sha" >> "$GITHUB_OUTPUT"
          printf 'backend_sha=%s\n' "$backend_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cross-repo contract (7 required tests)
        id: cross-repo-contract
        run: |
          mkdir -p test-results
          bun run test src/modules/enterprise_business/api/crossRepoContract.test.ts \
            --reporter=junit --reporter-outfile=test-results/cross-repo-contract.xml

      - name: Verify and summarize cross-repo execution
        if: ${{ always() }}
        env:
          CONTRACT_OUTCOME: ${{ steps.cross-repo-contract.outcome }}
          BACKEND_REF: ${{ steps.backend-ref.outputs.ref }}
          ADMIN_SHA: ${{ steps.contract-source.outputs.admin_sha }}
          BACKEND_SHA: ${{ steps.contract-source.outputs.backend_sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          outcome = os.environ['CONTRACT_OUTCOME']
          lines = [
              '## Cross-repo contract / 跨仓契约',
              f"- Admin tested checkout: `{os.environ['ADMIN_SHA'] or 'unavailable'}` (PR: merge checkout)",
              f"- Backend requested ref: `{os.environ['BACKEND_REF'] or 'unavailable'}`",
              f"- Backend tested SHA: `{os.environ['BACKEND_SHA'] or 'unavailable'}`",
              f'- Test step outcome: `{outcome}`; required: 7 pass / 0 fail / 0 skip.',
          ]
          ok = False
          try:
              cases = list(ET.parse('test-results/cross-repo-contract.xml').iter('testcase'))
              skipped = [case for case in cases if case.find('skipped') is not None]
              failed = [case for case in cases if case.find('failure') is not None or case.find('error') is not None]
              passed = len(cases) - len(skipped) - len(failed)
              lines += [
                  '', '| Collected / 收集 | Executed / 执行 | Pass | Fail | Skip |',
                  '| ---: | ---: | ---: | ---: | ---: |',
                  f'| {len(cases)} | {len(cases) - len(skipped)} | {passed} | {len(failed)} | {len(skipped)} |',
              ]
              for case in skipped:
                  skip = case.find('skipped')
                  reason = skip.get('message') or ''.join(skip.itertext()).strip() or 'unspecified skip (forbidden in this gate)'
                  lines.append(f"- SKIP: {case.get('name')}: {reason}")
              if not skipped:
                  lines.append('- Skip reasons / 跳过原因: none / 无。')
              ok = outcome == 'success' and len(cases) == 7 and passed == 7
          except (OSError, ET.ParseError) as error:
              status = 'NOT RUN / 上游失败，未执行' if outcome == 'skipped' else 'INCOMPLETE / 无有效结果'
              lines.append(f'- {status}; counts unavailable / 数量不可确认: {error}')
          lines.append('- Gate / 门禁: ' + ('PASS' if ok else 'FAIL'))
          summary = '\n'.join(lines) + '\n'
          print(summary)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as target:
              target.write(summary)
          if not ok:
              raise SystemExit('Cross-repo contract requires a successful report with exactly 7 passed tests and no skips.')
          PY

      - name: Lint
        run: bun run lint

      - name: Test
        run: |
          set -euo pipefail
          bun run test src --coverage 2>&1 | tee coverage.txt
          read -r function_pct line_pct < <(
            awk -F'|' '/^All files/ {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3)
              print $2, $3
            }' coverage.txt
          )
          test -n "$function_pct" && test -n "$line_pct"
          awk -v actual="$function_pct" 'BEGIN { exit !(actual >= 74) }' || {
            echo "::error::Function coverage ${function_pct}% is below 74%"
            exit 1
          }
          awk -v actual="$line_pct" 'BEGIN { exit !(actual >= 87) }' || {
            echo "::error::Line coverage ${line_pct}% is below 87%"
            exit 1
          }

      - name: Channel regression gate
        run: |
          bun run test src/services/api/payloadServices.test.ts
          bun run test src/pages/channels/ChannelMessagePage.test.tsx \
            src/pages/channels/ChannelSubscriberPage.test.tsx \
            src/pages/channels/ChannelAdminPage.test.tsx \
            src/pages/channels/ChannelInvitationPage.test.tsx \
            src/pages/channels/ChannelOrderPage.test.tsx

      - name: Moment regression gate
        run: |
          bun run test src/pages/moments/MomentReportPage.test.tsx

      - name: Backend readiness gate skipped
        if: ${{ vars.IMBOY_ADMIN_BASE_URL == '' }}
        run: echo "IMBOY_ADMIN_BASE_URL is not configured; skipping backend readiness gate."

      - name: UX backend readiness gate
        if: ${{ vars.IMBOY_ADMIN_BASE_URL != '' }}
        env:
          IMBOY_ADMIN_BASE_URL: ${{ vars.IMBOY_ADMIN_BASE_URL }}
        run: bash scripts/check_ux_backend_readiness.sh --strict

      - name: Build
        run: bun run build

      - name: Upload cross-repo test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cross-repo-contract
          path: test-results/cross-repo-contract.xml
          if-no-files-found: warn

  # 复用本次契约检查实际检出的 SHA；镜像仅在 runner 构建/运行，不发布。
  # Reuse the exact tested revisions; build/load/run locally without publishing.
  docker-images:
    name: ${{ inputs.backend_sha && 'Docker images (paired backend SHA, linux/amd64)' || 'Docker images (linux/amd64)' }}
    needs: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMBOY_REPO_DIR: ${{ github.workspace }}/.cross-repo/imboy
    steps:
      - name: Checkout tested frontend
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.lint-and-build.outputs.admin_sha }}
          persist-credentials: false

      - name: Test Admin runtime configuration
        run: python3 -B -m unittest discover -s scripts -p 'test_admin_entrypoint.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 必须先构建 Admin：宿主 node_modules 不得覆盖 Docker builder 安装的依赖。
      # Build Admin before host install/cross-repo checkout can enter COPY . .
      - name: Build and load the real Admin Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: imboy-admin:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.lint-and-build.outputs.admin_sha }}

      - name: Checkout the same tested backend for Widget pairing
        uses: actions/checkout@v7
        with:
          repository: imboy-pub/imboy
          ref: ${{ needs.lint-and-build.outputs.backend_sha }}
          path: .cross-repo/imboy
          persist-credentials: false
          sparse-checkout: |
            scripts/check_widget_asset_pairing.sh
            priv/cs_widget_asset_pairing.json
            src/features/customer_service/interfaces/cs_widget_handler.erl
            src/features/customer_service/interfaces/cs_widget_frame_handler.erl
            src/features/customer_service/interfaces/cs_seat_console_handler.erl
          sparse-checkout-cone-mode: false

      - name: Record and verify Docker source inputs
        env:
          ADMIN_SHA: ${{ needs.lint-and-build.outputs.admin_sha }}
          BACKEND_SHA: ${{ needs.lint-and-build.outputs.backend_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMIN_SHA"
          test "$(git -C "$IMBOY_REPO_DIR" rev-parse HEAD)" = "$BACKEND_SHA"
          {
            echo '## Docker source inputs / Docker 源码输入'
            printf -- '- Frontend tested checkout: %s (PR: merge checkout)\n' "$ADMIN_SHA"
            printf -- '- Backend tested checkout: %s\n' "$BACKEND_SHA"
            echo '- Platform: linux/amd64; Bun: 1.3.14 (actual builder version and resolved base images are in the Docker build log).'
            echo '- These checks build and run local images only; no registry push or release validation is implied.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Check Widget pairing with the release contract
        run: |
          set -euo pipefail
          ADMIN_REPO_DIR="$GITHUB_WORKSPACE" bash "$IMBOY_REPO_DIR/scripts/check_widget_asset_pairing.sh"
          bun run verify:widget-pairing

      - name: Build and verify real Widget assets
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build:widget
          bun run verify:widget
          test "$(jq -r .source_head dist-widget/manifest.json)" = "$(git rev-parse HEAD)"

      - name: Build and load the real Widget Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.widget
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: imboy-widget:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.lint-and-build.outputs.admin_sha }}

      - name: Verify Admin and Widget image runtimes
        run: bash scripts/check_docker_images.sh imboy-admin:ci imboy-widget:ci

  # ----------------------------------------------------------------
  # DCO — 仅 PR 检查，验证所有 commits 带有 Signed-off-by
  # （dependabot[bot] 豁免：其提交无法带 signoff，DCO 语义针对人类贡献者）
  # ----------------------------------------------------------------
  dco-check:
    name: DCO check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: DCO check（shell 实现；dco-org/dco-action 仓库已下线）
        run: |
          # Validate contributed commits, not GitHub's unsigned synthetic merge.
          # 验证 PR 实际提交，不包含 GitHub 自动生成且无签署的测试合并提交。
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          rc=0
          while read -r sha email; do
            # 两段式 + -F 固定串：单条正则会对 email 中的 [ ] + . 等元字符
            # 误判（dependabot[bot] 必误报缺签名）
            if ! git log -1 --format='%b' "$sha" | grep -i "^signed-off-by:" | grep -qiF "<${email}>"; then
              echo "::error::commit ${sha:0:12}: 作者 <${email}> 缺少匹配的 Signed-off-by（git commit --amend -s 补签）"
              rc=1
            fi
          done < <(git log --format='%H %ae' "$range")
          exit $rc
