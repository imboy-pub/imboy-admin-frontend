# Browser smoke scope / 浏览器冒烟范围：
# Only pure-mock specs run here (setup-flow + customer-service-home.mock),
# using mocked API responses without a backend.
# 此门仅运行纯 mock 用例（setup-flow + customer-service-home.mock），不代表
# 后端真实链路或全部 E2E 通过。
# Keep the explicit file selection: other suites require backend credentials,
# dedicated integration stacks, or production access and must not run implicitly.
# 其他套件需要后端凭据、专用集成栈或生产访问，禁止在此隐式扩大执行范围。
# 新增纯 mock 用例时显式追加到此清单并先本地验证（2026-11-28 扩容：混合池
# ~17 需真后端走 nightly 路线、纯真后端 ~33 需凭据，均不入此门）。

name: admin Playwright E2E

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

jobs:
  e2e:
    name: Playwright e2e (chromium)
    # ubuntu-latest 自 2026-10-19 迁移到 Ubuntu 26，Playwright 1.59 的
    # `playwright install --with-deps` 尚不支持 ubuntu26.04，故固定 24.04；
    # 升级 @playwright/test 支持后可恢复 ubuntu-latest
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Cache Playwright browsers
        # 浏览器二进制缓存（OS deps 仍由 --with-deps 每次 apt 安装）；
        # 版本随 package.json/bun.lock 变化自动换 key。
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Report E2E scope / 报告 E2E 范围
        run: |
          total=$(find tests/e2e -type f -name '*.spec.ts' | wc -l)
          {
            echo '### Playwright scope / Playwright 执行范围'
            echo '- Selected / 已选择（纯 mock / pure mock）：'
            echo '  - tests/e2e/setup-flow.spec.ts'
            echo '  - tests/e2e/customer-service-home.mock.spec.ts'
            echo "- Repository spec files / 仓库 spec 文件：${total}"
            echo "- Outside this invocation / 本次未选择：$((total - 2)) spec files"
            echo '- A passing result covers only the selected mock suites, not backend integration or production health.'
            echo '- 绿色结果仅覆盖所选 mock 套件，不代表后端集成或生产健康检查通过。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run pure-mock browser smoke / 运行纯 mock 浏览器冒烟
        run: bunx playwright test tests/e2e/setup-flow.spec.ts tests/e2e/customer-service-home.mock.spec.ts

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test traces / videos / screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
