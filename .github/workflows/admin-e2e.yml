# Browser smoke scope / 浏览器冒烟范围：
# Only setup-flow.spec.ts runs here, using mocked API responses without a backend.
# 此门仅运行 setup-flow.spec.ts 的 API mock 用例，不代表后端真实链路或全部 E2E 通过。
# Keep the explicit file selection: other suites require backend credentials,
# dedicated integration stacks, or production access and must not run implicitly.
# 其他套件需要后端凭据、专用集成栈或生产访问，禁止在此隐式扩大执行范围。

name: admin Playwright E2E

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

jobs:
  e2e:
    name: Playwright e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Report E2E scope / 报告 E2E 范围
        run: |
          total=$(find tests/e2e -type f -name '*.spec.ts' | wc -l)
          {
            echo '### Playwright scope / Playwright 执行范围'
            echo '- Selected / 已选择：tests/e2e/setup-flow.spec.ts (mocked API / API mock)'
            echo "- Repository spec files / 仓库 spec 文件：${total}"
            echo "- Outside this invocation / 本次未选择：$((total - 1)) spec files"
            echo '- A passing result covers only the selected mock suite, not backend integration or production health.'
            echo '- 绿色结果仅覆盖所选 mock 套件，不代表后端集成或生产健康检查通过。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run setup-flow browser smoke / 运行 setup-flow 浏览器冒烟
        run: bunx playwright test tests/e2e/setup-flow.spec.ts

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test traces / videos / screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
