# imboy-admin-frontend SonarCloud scan workflow
#
# 关联：.claude/plans/quality-loop.md v1.3 T4.3（v1.1 §302 + §332）
# 创建：2026-05-09 / iteration 78 / T4.3
# 配置文件：imboy-admin-frontend/sonar-project.properties
# 前置：用户在 SonarCloud 创建 imboy-admin-frontend 项目 + GitHub Secret SONAR_TOKEN

name: admin SonarCloud

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage（best-effort）
        run: |
          set -euxo pipefail
          bun test --isolate --coverage || echo "::warning::bun test failed; sonar 仍上传源码 + lint baseline"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
