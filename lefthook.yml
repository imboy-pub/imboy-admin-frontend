# Lefthook hooks for imboy-admin-frontend (React / TypeScript / Vite)
# Generated by quality-loop T1.1 on 2026-05-08
# See .claude/plans/quality-loop.md for context

pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "src/**/*.{ts,tsx,js,jsx}"
      run: pnpm exec eslint --max-warnings=0 {staged_files}
      stage_fixed: false
    prettier:
      glob: "src/**/*.{ts,tsx,js,jsx,json,css,scss,md}"
      run: pnpm exec prettier --check {staged_files}
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
