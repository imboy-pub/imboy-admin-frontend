# CSD-IMG-01：客服 Widget 静态 runtime nginx 配置（整体替换 /etc/nginx/nginx.conf）。
#
# 与官方默认配置的差异及原因：
# - pid/error_log/temp 全部落 /tmp → 配合 docker --read-only + tmpfs /tmp；
# - 无 user 指令 → master 以容器运行 uid（101）执行，worker 继承同 uid；
# - listen 8080 → 非 root 可 bind 的固定端口；
# - Cache-Control 逐 location 按 S6 冻结表显式下发（add_header 在 location 级
#   覆盖继承，故每个 location 重复安全头）；
# - 不配置 X-Frame-Options（widget 资产可能被宿主站 iframe 面引用，XFO 豁免面
#   由部署层 vhost 与后端动态 frame 面管理，本静态层不添加不放宽）；
# - 默认 location no-store（fail-closed：未列入 S6 的路径不缓存）。

pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;

    # 只读根文件系统：全部 temp path 落 tmpfs /tmp
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        # ---- S6：loader 稳定入口 no-cache（/v1/loader.js 为生产 snippet 路径别名）----
        location = /loader.js {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files /loader.js =404;
        }
        location = /v1/loader.js {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files /loader.js =404;
        }

        # ---- S6：内容 hash 资产 immutable ----
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        # ---- R2-F1/F3：/widget-assets/* = 版本化帧资产（合同 S4 字面路径，
        # /w/ frame 引用 cs-widget.v2.js）。稳定版本名的入口内容随发布原位
        # 更新——必须 no-cache 重验证（immutable 会把漏改名的热修冻结最长
        # 一年）；内容哈希 chunk 仍走 /assets/* immutable。 ----
        location /widget-assets/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # ---- S6：frame HTML（widget/index.html）no-store ----
        location /widget/ {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # ---- S6：manifest / health no-store ----
        location = /manifest.json {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files /manifest.json =404;
        }
        location = /manifest.sha256 {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files /manifest.sha256 =404;
        }
        location = /health.txt {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files /health.txt =404;
        }

        # fail-closed：未列入 S6 的路径一律 no-store
        location / {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri $uri/ =404;
        }
    }
}
